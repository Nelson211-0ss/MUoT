services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - portal_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://nginx
      APP_KEY: ${BACKEND_APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: portal
      DB_USERNAME: portal
      DB_PASSWORD: portal
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: cookie
      FRONTEND_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    command: >-
      bash -lc "composer install --no-interaction
      && (php artisan key:generate --force --ansi || true)
      && php artisan migrate --force --ansi
      && php artisan serve --host=0.0.0.0 --port=8000"
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    command: >-
      bash -lc "npm install
      && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - backend
    expose:
      - "3000"
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  portal_pg:
